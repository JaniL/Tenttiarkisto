{{define "content"}}
<h1>{{if .User}}Edit{{else}}New{{end}} User</h1>

{{template "errors" .}}

<form method="post" action="{{if .User}}/users/{{.User.ID}}/update{{else}}/users{{end}}">
  {{.CSRFField}}
  <div class="mb-3">
    <label class="form-label" for="organization">Organization</label>
    <input type="text" class="form-control" id="organization" name="organization" value="{{if .User}}{{.User.Organization}}{{end}}" required>
  </div>
  {{if not .User}}
  <div class="mb-3">
    <label class="form-label" for="email">Email</label>
    <input type="email" class="form-control" id="email" name="email" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="password">Password</label>
    <input type="password" class="form-control" id="password" name="password" minlength="8" required>
  </div>
  {{end}}
  <div class="mb-3">
    <label class="form-label">Subjects</label>
    {{range .Subjects}}
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="subject_ids" value="{{.ID}}"
        id="subject-{{.ID}}" {{if (index $.SelSubjects .ID)}}checked{{end}}>
      <label class="form-check-label" for="subject-{{.ID}}">{{.Name}}</label>
    </div>
    {{end}}
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="/users" class="btn btn-link">Back</a>
</form>
{{end}}
